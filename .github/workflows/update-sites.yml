name: Site listesini guncelle

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Yeni siteleri ara ve dogrula
        run: node tools/discover.js
      - name: Listeyi commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.json
          git diff --cached --quiet || git commit -m "Otomatik: yeni film siteleri eklendi"
          git push
